<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <title>Autentificare</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background-color: #f4f6f9;
    }
    .login-box {
      max-width: 400px;
      margin: 100px auto;
      padding: 30px;
      background: white;
      border-radius: 10px;
      box-shadow: 0 0 15px rgba(0,0,0,0.1);
    }
  </style>
</head>
<body>
  <div class="login-box">
    <h3 class="text-center mb-4">🔐 Autentificare</h3>
    <form onsubmit="return autentificare()">
      <div class="mb-3">
        <label for="email" class="form-label">Email:</label>
        <input type="email" class="form-control" id="email" required placeholder="ex: profesor@test.com">
      </div>
      <div class="mb-3">
        <label for="parola" class="form-label">Parolă:</label>
        <input type="password" class="form-control" id="parola" required>
      </div>
      <button type="submit" class="btn btn-primary w-100">Login</button>
    </form>
    <div id="mesajEroare" class="text-danger text-center mt-3"></div>
  </div>

  <script>
    function autentificare() {
      const email = document.getElementById("email").value.trim();
      const parola = document.getElementById("parola").value;

      // Date conturi
      const conturi = {
        "profesor@test.com": {
          parola: "parola123",
          redirectionare: "./dashboard/profesor/dashboard-profesor.html"
        },
        "student@test.com": {
          parola: "student123",
          redirectionare: "./dashboard/student/dashboard-student.html"
        },
        "admin@test.com": {
          parola: "admin123",
          redirectionare: "./dashboard/admin/dashboard-admin.html"
        }
      };

      if (conturi[email] && conturi[email].parola === parola) {
        // Login reușit
        window.location.href = conturi[email].redirectionare;
        return false;
      } else {
        document.getElementById("mesajEroare").innerText = "Email sau parolă greșită!";
        return false;
      }
    }
  </script>
</body>
</html>
