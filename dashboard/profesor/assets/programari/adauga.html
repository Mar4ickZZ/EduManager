<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <title>Adaugă Programare</title>
  <link href="../css/bootstrap.min.css" rel="stylesheet">
  <script>
    function validateForm() {
      var student = document.getElementById('student').value;
      var curs = document.getElementById('curs').value;
      var data = document.getElementById('data').value;
      var ora = document.getElementById('ora').value;

      if (student == "" || curs == "" || data == "" || ora == "") {
        alert("Te rugăm să completezi toate câmpurile!");
        return false;
      }
      return true;
    }
  </script>
</head>
<body>
  <div class="container mt-5">
    <h2>📅 Adaugă o Nouă Programare</h2>

    <form onsubmit="return validateForm()" action="save_programare.html" method="post">
      <div class="mb-3">
        <label for="student" class="form-label">Student</label>
        <input type="text" class="form-control" id="student" name="student" required>
      </div>
      <div class="mb-3">
        <label for="curs" class="form-label">Curs</label>
        <input type="text" class="form-control" id="curs" name="curs" required>
      </div>
      <div class="mb-3">
        <label for="data" class="form-label">Data Programării</label>
        <input type="date" class="form-control" id="data" name="data" required>
      </div>
      <div class="mb-3">
        <label for="ora" class="form-label">Ora Programării</label>
        <input type="time" class="form-control" id="ora" name="ora" required>
      </div>

      <button type="submit" class="btn btn-primary">Adaugă Programare</button>
    </form>
  </div>
</body>
</html>
