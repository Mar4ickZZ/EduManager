<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <title>Materiale Curs</title>
  <link href="../css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  <div class="container mt-5">
    <h2>📁 Materiale pentru cursul: Programare Web</h2>
    <a href="upload.html" class="btn btn-success mb-3">+ Încarcă Material</a>

    <table class="table table-striped">
      <thead class="table-dark">
        <tr>
          <th>#</th>
          <th>Nume Fișier</th>
          <th>Tip</th>
          <th>Previzualizare</th>
          <th>Data Încărcării</th>
          <th>Acțiuni</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td>1</td>
          <td>suport-curs.pdf</td>
          <td>PDF</td>
          <td><a href="../img/example.pdf" download>Vezi</a></td>
          <td>2025-04-10</td>
          <td>
            <button onclick="confirmStergere()" class="btn btn-danger btn-sm">Ștergere</button>
          </td>
        </tr>
        <tr>
          <td>2</td>
          <td>exemplu.png</td>
          <td>Imagine</td>
          <td><img src="../img/example.png" class="img-thumbnail"></td>
          <td>2025-04-11</td>
          <td>
            <button onclick="confirmStergere()" class="btn btn-danger btn-sm">Ștergere</button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>

  <script>
    function confirmStergere() {
      if (confirm("Ștergi acest fișier?")) {
        alert("Fișierul a fost șters. (simulare)");
      }
    }
  </script>
</body>
</html>
