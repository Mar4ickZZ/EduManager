<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <title>EduManager - Autentificare</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center justify-content-center vh-100">
  <div class="card p-4 shadow-lg" style="width: 25rem;">
    <h4 class="text-center mb-4">Autentificare EduManager</h4>
    <form id="loginForm" onsubmit="return valideazaLogin()">
      <div class="mb-3">
        <label for="email" class="form-label">Email</label>
        <input type="email" class="form-control" id="email" placeholder="exemplu@email.com" required>
      </div>
      <div class="mb-3">
        <label for="parola" class="form-label">Parolă</label>
        <input type="password" class="form-control" id="parola" required>
      </div>
      <div class="mb-3">
        <label for="rol" class="form-label">Rol</label>
        <select class="form-select" id="rol" required>
          <option value="">Selectează rol</option>
          <option value="profesor">Profesor</option>
          <option value="student">Student</option>
        </select>
      </div>
      <button type="submit" class="btn btn-primary w-100">Autentificare</button>
    </form>
  </div>

  <script src="js/validari.js"></script>
</body>
</html>
